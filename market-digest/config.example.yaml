# 复制为 config.yaml 后修改。密钥类信息放在 .env（见 .env.example），不要写在这里。

timezone: America/New_York     # 所有定时任务按美东时间
database: data/market_digest.db
dashboard_url: http://localhost:8000   # 邮件里的 Dashboard 链接

llm:
  model: claude-opus-5          # 提取点位 / 写总结用的模型
  effort: medium                # low / medium / high，越高越准也越贵

poll_minutes: 5                 # 多久检查一次所有来源的更新

# 点位多久后从 Dashboard 上过期（按博主给的时间框架）
level_ttl_days:
  intraday: 1
  swing: 10
  long_term: 60
  unspecified: 5

cluster_tolerance_pct: 0.6      # 不同博主给的点位相差多少 % 以内视为同一个点位

schedule:                       # 美东时间。只写时间 = 周一到周五；可加星期，如 "sun 18:00"、"mon-sun 07:30"
  premarket: "08:45"            # 点位简报（点位本身在 Dashboard 上实时更新）
  midday: "12:30"
  close: "16:30"
  macro_daily: "mon-sun 19:00"  # 每日宏观总结：综合过去 24 小时所有来源的宏观观点
  weekly_macro: "sun 18:00"     # 宏观周报
macro_alert_immediately: false  # true = 每条宏观视频/帖子一出来就单独发一封邮件（默认只发每日总结）

# ------------------------------------------------------------------
# 信息源。category:
#   levels = 主要给点位   macro = 主要讲宏观   both = 两者都有
# ------------------------------------------------------------------
youtube_transcribe:             # 视频没有字幕时：下载音频，用 Whisper 在本机做语音识别（免费）
  enabled: true
  model: small                  # tiny / base / small / medium：越大越准越慢。small 转 30 分钟视频约 5–15 分钟（CPU）
  language: zh                  # 频道语言：优先下载这个语言的字幕，语音识别也按它识别
  # 如果日志里出现 “Sign in to confirm you're not a bot”，让程序借用浏览器里的 YouTube 登录（二选一）：
  cookies_from_browser: ""      # 填 firefox（最稳）/ edge / chrome；该浏览器需登录过 YouTube
  cookies_file: ""              # 或者用浏览器插件导出的 cookies.txt 的路径

youtube:
  # channel_id 可以用 `python -m market_digest resolve-youtube @频道handle` 查
  - name: 示例博主A
    channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
    category: levels
  - name: 示例宏观频道
    channel_id: UCyyyyyyyyyyyyyyyyyyyyyy
    category: macro

websites:
  # 博主个人网站上的点位页面。程序定期抓取，内容有变化就重新提取点位。
  - name: 示例博主网站
    url: https://example.com/levels
    category: levels
    cookie_env: ""              # 页面需要登录时：把浏览器里的 Cookie 放进 .env 的某个变量，这里填变量名

x:
  # 默认：在 X 上给这些账号开启“推文通知 → 邮件”，程序从邮箱读取。
  # 如果在 .env 里配置了 X_BEARER_TOKEN，则改用官方 API 直接拉取推文。
  - name: 示例推特博主
    handle: example_trader
    category: levels

discord:
  # 推荐：Windows 电脑上开着 Discord 电脑版，程序直接读取 Windows 右下角的 Discord 通知。
  #   1) Discord 里把博主那个频道的通知设为「所有消息」
  #   2) match：通知标题/内容里必须同时出现的关键词，一般填服务器名 + 博主昵称
  # 其他方式（安卓手机转发、手动转发到自己的服务器）见 README「Discord 设置」。
  - name: 示例Discord博主
    match: ["服务器名", "博主昵称"]
    category: both

email_inbox:                    # 仅在不用 X 付费 API 时需要：读取 X 通知邮件的邮箱（IMAP）
  host: imap.gmail.com
  folder: INBOX
  x_senders: ["notify@x.com", "info@x.com", "notify@twitter.com"]
