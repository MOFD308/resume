# 你的实际配置。密钥类信息放在 .env（见 .env.example），不要写在这里。
# 同一个博主在不同平台用同一个 name：看板会把他算作一位博主，不会自己跟自己“共识”。

timezone: America/New_York     # 所有定时任务按美东时间
database: data/market_digest.db
dashboard_url: http://localhost:8000   # 部署后改成你的看板地址，邮件里的链接会用它

llm:
  model: claude-opus-5
  effort: medium

poll_minutes: 5

level_ttl_days:
  intraday: 1
  swing: 10
  long_term: 60
  unspecified: 5

cluster_tolerance_pct: 0.6

schedule:                       # 美东时间。只写时间 = 周一到周五；可加星期，如 "sun 18:00"、"mon-sun 07:30"
  premarket: "08:45"
  midday: "12:30"
  close: "16:30"
  macro_daily: "mon-sun 19:00"  # 美东 19:00 = 北京时间次日 07:00（夏令时）
  weekly_macro: "sun 18:00"
macro_alert_immediately: false

youtube_transcribe:             # 视频没有字幕时：下载音频，用 Whisper 在本机做语音识别（免费）
  enabled: true
  model: turbo                  # large-v3-turbo：中文准确度接近最大的 large-v3，速度快得多。首次使用自动下载约 1.6GB。可选 small（快、较不准）/ medium / large-v3（最准、最慢）
  language: zh                  # 频道语言：优先下载这个语言的字幕，语音识别也按它识别
  # 如果日志里出现 “Sign in to confirm you're not a bot”，让程序借用浏览器里的 YouTube 登录（二选一）：
  cookies_from_browser: ""      # 填 firefox（最稳）/ edge / chrome；该浏览器需登录过 YouTube
  cookies_file: ""              # 或者用浏览器插件导出的 cookies.txt 的路径

youtube:
  - name: Shanghao Jin
    channel_id: UCTAJ0JnR9oYvILu-mtNcufQ    # @shanghaojin
    category: both
  - name: MrBoKong
    channel_id: UCNo5-yY8o53AFHS4AladYIg    # @MrBoKong
    category: both

websites: []
  # - name: 博主名
  #   url: https://...
  #   category: levels

x:
  - name: Shanghao Jin
    handle: ShanghaoJin
    category: both
  - name: MrBoKong
    handle: mrbokong
    category: both

discord:
  # 推荐：Windows 电脑上开着 Discord 电脑版，程序直接读取 Windows 右下角的 Discord 通知。
  #   1) Discord 里把博主那个频道的通知设为「所有消息」
  #   2) match：通知标题/内容里必须同时出现的关键词，一般填服务器名 + 博主昵称
  # 其他方式（安卓手机转发、手动转发到自己的服务器）见 README「Discord 设置」。
  - name: 菠萝头
    # 服务器「菠萝头美股社区」的「菠萝专区-点位看这」频道。
    # 只取名字里有辨识度的部分，通知格式略有不同也能匹配。
    match: ["菠萝头", "点位看这"]
    category: both

email_inbox:
  host: imap.gmail.com
  folder: INBOX
  x_senders: ["notify@x.com", "info@x.com", "notify@twitter.com"]
